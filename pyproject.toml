[project]
name = "hellabandz"
version = "0.1.0"
description = "Deterministic trading infrastructure for autonomous AI strategy agents"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  "numpy>=2.1",
  "pyarrow>=17",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "openai>=1.55",
  "solders>=0.29.0",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "pytest-timeout>=2.3",
]

bench = ["aiohttp>=3.14.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hellabandz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres/TimescaleDB (DATABASE_URL)"]
timeout = 300
