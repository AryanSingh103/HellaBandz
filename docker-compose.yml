# Resource limits are part of the benchmark methodology (docs/PERFORMANCE.md).
name: quantswarm  # Docker project name kept: renaming it starts fresh containers and empty volumes
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: quantswarm
      POSTGRES_PASSWORD: quantswarm
      POSTGRES_DB: quantswarm
    ports: ["127.0.0.1:5432:5432"]
    cpus: 2
    mem_limit: 2g
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=200"]
    healthcheck:
      # over TCP: on a fresh volume the image runs a socket-only bootstrap server first, which must not count as healthy
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U quantswarm -d postgres"]
      interval: 2s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql/data]

  worker:
    build: .
    command: ["python", "-m", "hellabandz.execution.worker"]
    environment:
      DATABASE_URL: ${QS_DATABASE_URL:-postgresql://quantswarm:quantswarm@db:5432/quantswarm}
    depends_on: { db: { condition: service_healthy } }
    cpus: 1
    mem_limit: 512m
    restart: "no"

  api:
    build: .
    command: ["uvicorn", "hellabandz.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${QS_DATABASE_URL:-postgresql://quantswarm:quantswarm@db:5432/quantswarm}
      QS_API_POOL: ${QS_API_POOL:-20}
      QS_AUTH_REQUIRED: ${QS_AUTH_REQUIRED:-0}
      QS_API_TOKEN: ${QS_API_TOKEN:-}
      QS_ALLOWED_ORIGINS: ${QS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
      QS_AUDIT_SIGNER: ${QS_AUDIT_SIGNER:-}
      QS_LLM_PROVIDER: ${QS_LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      QS_GEMINI_MODEL: ${QS_GEMINI_MODEL:-gemini-3.8-flash}
      QS_OPENAI_FALLBACK: ${QS_OPENAI_FALLBACK:-1}
      QS_GEMINI_TIMEOUT_S: ${QS_GEMINI_TIMEOUT_S:-8}
      QS_GEMINI_COOLDOWN_S: ${QS_GEMINI_COOLDOWN_S:-60}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      QS_ANTHROPIC_MODEL: ${QS_ANTHROPIC_MODEL:-claude-sonnet-4-6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-onwK4e9ZLuTAKqWW03F9}
      QS_OPENAI_MODEL: ${QS_OPENAI_MODEL:-gpt-4.1-mini}
      SOLANA_RPC: ${SOLANA_RPC:-https://api.devnet.solana.com}
    ports: ["127.0.0.1:8000:8000"]
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 2s
      retries: 30
    cpus: 1
    mem_limit: 512m
    volumes:
      - ./data/snapshots:/app/data/snapshots:ro
      - ./data/manifests:/app/data/manifests
      - ./data/registry:/app/data/registry:ro

  manager:
    build: .
    init: true
    stop_grace_period: 45s
    command: ["python", "-m", "hellabandz.execution.manager"]
    environment:
      DATABASE_URL: ${QS_DATABASE_URL:-postgresql://quantswarm:quantswarm@db:5432/quantswarm}
      QS_API: http://api:8000
      QS_API_TOKEN: ${QS_API_TOKEN:-}
      QS_TOURNAMENT_PROCS: 2
      QS_OPENAI_FALLBACK: ${QS_OPENAI_FALLBACK:-1}
      QS_GEMINI_TIMEOUT_S: ${QS_GEMINI_TIMEOUT_S:-8}
      QS_GEMINI_COOLDOWN_S: ${QS_GEMINI_COOLDOWN_S:-60}
      QS_LLM_PROVIDER: ${QS_LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      QS_GEMINI_MODEL: ${QS_GEMINI_MODEL:-gemini-3.8-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QS_OPENAI_MODEL: ${QS_OPENAI_MODEL:-gpt-4.1-mini}
    volumes:
      - ./data/snapshots:/app/data/snapshots:ro
      - ./data/manifests:/app/data/manifests
      - ./data/registry:/app/data/registry
    depends_on: { api: { condition: service_healthy } }
    cpus: 2
    mem_limit: 1g
    restart: unless-stopped

  web:
    # trading terminal; the browser calls the API directly, so NEXT_PUBLIC_API is a host URL baked in at build time
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API: ${NEXT_PUBLIC_API:-http://localhost:8000}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: { api: { condition: service_healthy } }
    cpus: 1
    mem_limit: 512m

  bench:
    # load client for benchmarks/run_benchmarks.py db (runs inside the compose network)
    build:
      context: .
      args:
        QS_INSTALL_BENCH: "1"
    profiles: ["bench"]
    environment:
      DATABASE_URL: ${QS_DATABASE_URL:-postgresql://quantswarm:quantswarm@db:5432/quantswarm}
      QS_API_TOKEN: ${QS_API_TOKEN:-}
    cpus: 1
    mem_limit: 512m

  auditor:
    # Only this service receives the Devnet private key. API/worker/browser never do.
    build: .
    profiles: ["audit"]
    command: ["python", "-m", "hellabandz.audit.traces", "service"]
    environment:
      DATABASE_URL: ${QS_DATABASE_URL:-postgresql://quantswarm:quantswarm@db:5432/quantswarm}
      SOLANA_RPC: ${SOLANA_RPC:-https://api.devnet.solana.com}
      QS_AUDIT_SIGNER: ${QS_AUDIT_SIGNER:-}
      QS_AUDIT_INTERVAL: ${QS_AUDIT_INTERVAL:-300}
    volumes:
      - ./data/solana/devnet-keypair.json:/app/data/solana/devnet-keypair.json:ro
      - ./data/audits:/app/data/audits
    depends_on: { api: { condition: service_healthy } }
    cpus: 1
    mem_limit: 2g
    restart: unless-stopped

  prove:
    # `make prove-docker`: the test suite on Linux against this stack's Postgres (the process tests need POSIX signals)
    build: .
    profiles: ["prove"]
    working_dir: /src
    volumes: [".:/src"]
    environment:
      UV_PROJECT_ENVIRONMENT: /tmp/venv
      UV_LINK_MODE: copy
      QS_TEST_ADMIN_URL: postgresql://quantswarm:quantswarm@db:5432/postgres
    command: ["sh", "-c", "uv sync --frozen -q && uv run python scripts/prove.py"]
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
