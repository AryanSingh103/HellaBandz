# Resource limits are part of the benchmark methodology (docs/PERFORMANCE.md).
name: quantswarm
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: quantswarm
      POSTGRES_PASSWORD: quantswarm
      POSTGRES_DB: quantswarm
    ports: ["5432:5432"]
    cpus: 2
    mem_limit: 2g
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantswarm"]
      interval: 2s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql/data]

  worker:
    build: .
    command: ["python", "-m", "quantswarm.execution.worker"]
    environment:
      DATABASE_URL: ${QS_DATABASE_URL:-postgresql://quantswarm:quantswarm@db:5432/quantswarm}
    depends_on: { db: { condition: service_healthy } }
    cpus: 1
    mem_limit: 512m
    restart: "no"

  api:
    build: .
    command: ["uvicorn", "quantswarm.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${QS_DATABASE_URL:-postgresql://quantswarm:quantswarm@db:5432/quantswarm}
      QS_API_POOL: ${QS_API_POOL:-20}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
    cpus: 1
    mem_limit: 512m

  bench:
    # load client for benchmarks/run_benchmarks.py db (runs inside the compose network)
    build: .
    profiles: ["bench"]
    environment:
      DATABASE_URL: postgresql://quantswarm:quantswarm@db:5432/quantswarm
    cpus: 1
    mem_limit: 512m

volumes:
  pgdata:
